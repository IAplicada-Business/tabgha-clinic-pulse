<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tabgha OS — Design System v3 (navegável · pós direcionamento 24/07)</title>
<style>
/* ============================================================
   TOKENS — espelham src/styles.css
   ============================================================ */
:root {
  --radius: 0.625rem;
  --bg: oklch(0.999 0.003 85);
  --fg: oklch(0.152 0.068 265);
  --card: oklch(1 0 0);
  --card-fg: oklch(0.152 0.068 265);
  --primary: oklch(0.42 0.13 248);
  --primary-fg: oklch(1 0 0);
  --secondary: oklch(0.963 0.006 80);
  --muted: oklch(0.963 0.006 80);
  --muted-fg: oklch(0.515 0.022 255);
  --accent: oklch(0.952 0.022 248);
  --accent-fg: oklch(0.28 0.09 248);
  --destructive: oklch(0.577 0.245 27.325);
  --destructive-fg: oklch(1 0 0);
  --border: oklch(0.910 0.008 82);
  --input: oklch(0.910 0.008 82);
  --ring: oklch(0.52 0.10 248);
  --sidebar: oklch(0.978 0.005 82);
  --sidebar-fg: oklch(0.152 0.068 265);
  --sidebar-primary: oklch(0.42 0.13 248);
  --sidebar-accent: oklch(0.942 0.025 248);
  --sidebar-accent-fg: oklch(0.30 0.10 248);
  --sidebar-border: oklch(0.910 0.008 82);
  --brand-navy: oklch(0.152 0.068 265);
  --brand-blue: oklch(0.42 0.13 248);
  --brand-sky: oklch(0.765 0.090 220);
  --green-100: oklch(0.94 0.06 145); --green-700: oklch(0.45 0.13 145);
  --yellow-100: oklch(0.96 0.08 90); --yellow-700: oklch(0.50 0.13 80);
  --blue-100: oklch(0.94 0.04 240); --blue-700: oklch(0.42 0.13 248);
  --slate-100: oklch(0.95 0.005 250); --slate-600: oklch(0.50 0.02 255);
  --red-100: oklch(0.93 0.05 25); --red-700: oklch(0.50 0.20 27);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: "kern" 1, "liga" 1;
  font-size: 13px;
}
h1, h2, h3 { letter-spacing: -0.02em; line-height: 1.2; }
h2 { letter-spacing: -0.015em; line-height: 1.3; }
h3 { letter-spacing: -0.01em; }
a { color: inherit; text-decoration: none; }

/* ============================================================
   TOP CHROME — modo Admin × Cliente
   ============================================================ */
.chrome {
  position: sticky; top: 0; z-index: 10;
  background: var(--brand-navy); color: white;
  padding: 8px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid oklch(1 0 0 / 0.08);
  font-size: 12px;
}
.chrome .left { display: flex; align-items: center; gap: 12px; }
.chrome .brand { font-weight: 700; letter-spacing: -0.01em; font-size: 13px; }
.chrome .brand small { opacity: 0.6; font-weight: 500; margin-left: 6px; }
.chrome .modes { display: inline-flex; background: oklch(1 0 0 / 0.08); border-radius: 999px; padding: 2px; }
.chrome .modes button {
  border: 0; background: transparent; color: white;
  padding: 4px 12px; border-radius: 999px; font-size: 11px; cursor: pointer;
  font-weight: 500;
}
.chrome .modes button.active { background: var(--brand-blue); }
.chrome .hint { opacity: 0.55; font-size: 11px; }

/* ============================================================
   APP SHELL — sidebar 224px (mais compacta) + main
   ============================================================ */
.app { display: grid; grid-template-columns: 224px 1fr; min-height: calc(100vh - 36px); }

aside.sidebar {
  background: var(--sidebar); color: var(--sidebar-fg);
  border-right: 1px solid var(--sidebar-border);
  display: flex; flex-direction: column;
}
.sidebar .logo {
  height: 48px; padding: 0 14px;
  display: flex; align-items: center;
  border-bottom: 1px solid var(--sidebar-border);
  font-weight: 700; letter-spacing: -0.01em; font-size: 13px;
}
.sidebar nav { flex: 1; overflow-y: auto; padding: 6px 0 10px; }

/* GROUP — header clicável (expansível) */
.sidebar .group-header {
  display: flex; align-items: center; justify-content: space-between;
  width: calc(100% - 16px);
  margin: 6px 8px 0;
  padding: 6px 8px 6px 10px;
  border: 0; background: transparent;
  font-family: inherit; cursor: pointer;
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: oklch(0.515 0.022 255 / 0.55);
  border-radius: 6px;
  transition: background 120ms, color 120ms;
}
.sidebar .group-header:hover {
  background: oklch(0.910 0.008 82 / 0.5);
  color: oklch(0.152 0.068 265 / 0.8);
}
.sidebar .group-header .ct {
  display: inline-block; margin-left: 4px;
  background: oklch(0.910 0.008 82); color: oklch(0.515 0.022 255);
  font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 999px;
  letter-spacing: 0;
}
.sidebar .group-header.has-active {
  color: var(--sidebar-accent-fg);
}
.sidebar .group-header .chev {
  width: 12px; height: 12px; opacity: 0.55;
  transition: transform 200ms ease;
}
.sidebar .group-header.expanded .chev { transform: rotate(90deg); }
.sidebar .group-items {
  overflow: hidden;
  transition: max-height 220ms ease, opacity 180ms ease;
  max-height: 500px;
  opacity: 1;
}
.sidebar .group-items.collapsed {
  max-height: 0; opacity: 0;
  pointer-events: none;
}

/* ITEMS */
.sidebar nav a {
  display: flex; align-items: center; gap: 9px;
  margin: 1px 8px; padding: 6px 10px;
  border-radius: 7px; font-size: 12.5px; color: oklch(0.152 0.068 265 / 0.72);
  transition: background 120ms, color 120ms;
  cursor: pointer; user-select: none;
}
.sidebar nav a:hover { background: var(--accent); color: var(--accent-fg); }
.sidebar nav a.active {
  background: var(--sidebar-accent); color: var(--sidebar-accent-fg); font-weight: 600;
}
.sidebar nav a svg { width: 14px; height: 14px; opacity: 0.7; flex-shrink: 0; }
.sidebar nav a.active svg { opacity: 1; }
.sidebar nav a .badge-mini {
  margin-left: auto; background: var(--primary); color: white;
  font-size: 10px; padding: 1px 6px; border-radius: 999px; font-weight: 600;
}
.sidebar .foot {
  border-top: 1px solid var(--sidebar-border);
  padding: 10px 14px;
}
.sidebar .foot .user {
  font-size: 11px; font-weight: 500;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.sidebar .foot .logout {
  margin-top: 4px; font-size: 10.5px; color: var(--muted-fg);
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
}
.sidebar .foot .logout:hover { color: var(--fg); }
.sidebar .foot .logout svg { width: 12px; height: 12px; }

main {
  background: var(--bg);
  padding: 18px 22px 28px;
  overflow: auto;
}

/* ============================================================
   PAGE PATTERNS — densidade aumentada
   ============================================================ */
.page-head { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.page-head h1 { font-size: 20px; font-weight: 700; }
.page-head .sub { color: var(--muted-fg); margin-top: 3px; font-size: 12.5px; }
.crumb { font-size: 11px; color: var(--muted-fg); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.crumb svg { width: 11px; height: 11px; opacity: 0.6; }

.section { margin-top: 18px; }
.section .sec-title { font-size: 11px; font-weight: 600; margin-bottom: 8px; color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.05em; }

/* PRIMITIVES */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  height: 30px; padding: 0 12px;
  border-radius: 6px; border: 1px solid var(--border);
  background: var(--card); color: var(--fg);
  font-size: 12px; font-weight: 500; cursor: pointer;
  transition: background 120ms;
}
.btn:hover { background: var(--secondary); }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn.primary:hover { background: oklch(0.36 0.13 248); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { height: 26px; font-size: 11.5px; padding: 0 10px; }
.btn svg { width: 13px; height: 13px; }

.input {
  height: 30px; border: 1px solid var(--input); border-radius: 6px;
  padding: 0 10px 0 30px; background: var(--card); font-size: 12px; color: var(--fg);
  width: 100%; outline: none;
}
.input.plain { padding-left: 10px; }
.input:focus { border-color: var(--ring); box-shadow: 0 0 0 3px oklch(0.52 0.10 248 / 0.15); }
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--muted-fg); pointer-events: none; }

select.input { padding-right: 26px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted-fg) 50%), linear-gradient(135deg, var(--muted-fg) 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }

.badge {
  display: inline-flex; align-items: center; height: 18px; padding: 0 7px;
  border-radius: 999px; font-size: 10.5px; font-weight: 500;
}
.badge.ativo { background: var(--green-100); color: var(--green-700); }
.badge.onboarding { background: var(--blue-100); color: var(--blue-700); }
.badge.pausa { background: var(--yellow-100); color: var(--yellow-700); }
.badge.inativo { background: var(--slate-100); color: var(--slate-600); }
.badge.alert { background: var(--red-100); color: var(--red-700); }

/* KPI Card — mais compacto */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kpi {
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--card); padding: 12px 14px;
  position: relative;
}
.kpi .label { font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-fg); }
.kpi .value { font-size: 22px; font-weight: 700; margin-top: 6px; letter-spacing: -0.02em; line-height: 1.1; }
.kpi .delta { font-size: 11px; margin-top: 3px; color: var(--muted-fg); display: flex; align-items: center; gap: 3px; }
.kpi .delta.up { color: var(--green-700); }
.kpi .delta.down { color: var(--red-700); }
.kpi .delta svg { width: 11px; height: 11px; }
.kpi .icon { position: absolute; top: 12px; right: 12px; color: var(--muted-fg); }
.kpi .icon svg { width: 14px; height: 14px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
.card .hd { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; min-height: 38px; }
.card .hd h3 { font-size: 13px; font-weight: 600; }
.card .body { padding: 12px 14px; }
.card .body.flush { padding: 0; }

table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table th, table td { padding: 8px 12px; text-align: left; }
table th { font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted-fg); border-bottom: 1px solid var(--border); background: var(--secondary); }
table td { border-bottom: 1px solid var(--border); }
table tr:hover td { background: var(--secondary); }
table tr:last-child td { border-bottom: 0; }
table td .row-actions { display: flex; gap: 4px; justify-content: flex-end; }

/* TABS */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.tabs button { background: transparent; border: 0; padding: 8px 12px; font-size: 12.5px; color: var(--muted-fg); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; }
.tabs button:hover { color: var(--fg); }
.tabs button.active { color: var(--fg); border-bottom-color: var(--primary); font-weight: 600; }
.tabs.compact button { padding: 6px 10px; font-size: 12px; }

/* SUB-TABS dentro de uma tab principal */
.subtabs { display: inline-flex; background: var(--secondary); border-radius: 7px; padding: 2px; gap: 1px; margin-bottom: 12px; }
.subtabs button { background: transparent; border: 0; padding: 4px 10px; font-size: 11.5px; border-radius: 5px; cursor: pointer; color: var(--muted-fg); font-family: inherit; font-weight: 500; }
.subtabs button:hover { color: var(--fg); }
.subtabs button.active { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

/* KANBAN — colunas mais densas */
.kanban { display: grid; gap: 8px; align-items: start; }
.kanban.c4 { grid-template-columns: repeat(4, 1fr); }
.kanban.c6 { grid-template-columns: repeat(6, 1fr); }
.kanban .col { background: var(--secondary); border-radius: 9px; padding: 8px; min-height: 200px; }
.kanban .col h4 { font-size: 10.5px; font-weight: 600; text-transform: uppercase; color: var(--muted-fg); margin-bottom: 8px; letter-spacing: 0.05em; display: flex; justify-content: space-between; }
.kanban .col h4 .ct { background: oklch(0.910 0.008 82); padding: 1px 6px; border-radius: 999px; font-size: 10px; }
.kanban .card-mini { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-bottom: 6px; font-size: 12px; cursor: pointer; transition: box-shadow 120ms; }
.kanban .card-mini:hover { box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
.kanban .card-mini .t { font-weight: 600; margin-bottom: 2px; font-size: 12.5px; }
.kanban .card-mini .m { color: var(--muted-fg); font-size: 11px; line-height: 1.3; }
.kanban .card-mini .row { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }

/* ATENDIMENTO — 3 colunas */
.atendimento { display: grid; grid-template-columns: 280px 1fr 300px; height: calc(100vh - 36px - 60px); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
.atendimento .col { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; }
.atendimento .col:last-child { border-right: 0; }
.atendimento .conv-search { padding: 8px; border-bottom: 1px solid var(--border); }
.atendimento .conv-search .search-wrap svg { left: 16px; }
.atendimento .conv-search .input { padding-left: 32px; }
.atendimento .conv-tabs { display: flex; padding: 4px 8px 8px; gap: 4px; font-size: 11px; flex-wrap: wrap; }
.atendimento .conv-tabs span { padding: 3px 8px; border-radius: 999px; background: var(--secondary); color: var(--muted-fg); cursor: pointer; font-weight: 500; }
.atendimento .conv-tabs span.active { background: var(--primary); color: var(--primary-fg); }
.atendimento .conv-list { overflow-y: auto; flex: 1; }
.atendimento .conv-item { padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; gap: 9px; }
.atendimento .conv-item:hover { background: var(--secondary); }
.atendimento .conv-item.sel { background: var(--accent); }
.atendimento .conv-item .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 11px; flex-shrink: 0; }
.atendimento .conv-item .meta { flex: 1; min-width: 0; }
.atendimento .conv-item .meta .name { font-size: 12.5px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.atendimento .conv-item .meta .name .t { font-size: 10px; color: var(--muted-fg); font-weight: 400; }
.atendimento .conv-item .meta .preview { font-size: 11.5px; color: var(--muted-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }

.atendimento .chat { display: flex; flex-direction: column; background: var(--secondary); min-height: 0; }
.atendimento .chat-head { padding: 8px 14px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.atendimento .chat-head .who { font-weight: 600; font-size: 13px; }
.atendimento .chat-head .who .sub { font-weight: 400; font-size: 11px; color: var(--muted-fg); margin-top: 1px; }
.atendimento .chat-msgs { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
.atendimento .bubble { max-width: 70%; padding: 7px 11px; border-radius: 11px; font-size: 12.5px; line-height: 1.4; }
.atendimento .bubble.in { background: var(--card); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
.atendimento .bubble.bot { background: oklch(0.96 0.02 248); align-self: flex-end; border-bottom-right-radius: 4px; }
.atendimento .bubble.human { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
.atendimento .bubble .meta { font-size: 10px; opacity: 0.6; margin-top: 3px; }
.atendimento .composer { padding: 8px; background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 6px; align-items: flex-end; }
.atendimento .composer textarea { flex: 1; border: 1px solid var(--input); border-radius: 7px; padding: 7px 10px; font-family: inherit; font-size: 12.5px; resize: none; height: 56px; outline: none; }

.atendimento .info { padding: 12px 14px; overflow-y: auto; }
.atendimento .info .sec { font-size: 10.5px; text-transform: uppercase; color: var(--muted-fg); font-weight: 600; letter-spacing: 0.05em; margin: 10px 0 6px; }
.atendimento .info .sec:first-child { margin-top: 0; }
.atendimento .info .row-kv { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px dashed var(--border); }
.atendimento .info .row-kv .k { color: var(--muted-fg); }

/* MISC */
.row { display: flex; gap: 8px; align-items: center; }
.gap-2 { gap: 8px; }
.muted { color: var(--muted-fg); }
.small { font-size: 11.5px; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted-fg); border: 1px dashed var(--border); border-radius: 10px; font-size: 12.5px; }
.empty .ic { display: inline-flex; padding: 10px; background: var(--secondary); border-radius: 50%; margin-bottom: 8px; color: var(--muted-fg); }
.empty .ic svg { width: 22px; height: 22px; }

/* CHARTS */
.chart-card { padding: 14px; }
.chart-card h3 { font-size: 12.5px; font-weight: 600; margin-bottom: 8px; }
.legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted-fg); margin-top: 6px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: middle; }

/* FORMS */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.form-row { display: flex; flex-direction: column; gap: 4px; }
.form-row label { font-size: 11px; font-weight: 500; color: var(--muted-fg); }

/* CALENDÁRIO */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.cal .h, .cal .d { background: var(--card); padding: 6px; font-size: 11.5px; min-height: 68px; }
.cal .h { background: var(--secondary); text-align: center; font-weight: 600; color: var(--muted-fg); min-height: auto; text-transform: uppercase; font-size: 9.5px; letter-spacing: 0.06em; padding: 5px; }
.cal .d .num { font-weight: 600; font-size: 12px; }
.cal .d .ev { font-size: 9.5px; padding: 1px 5px; background: var(--accent); color: var(--accent-fg); border-radius: 3px; margin-top: 3px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal .d .ev.alt { background: oklch(0.94 0.06 145); color: oklch(0.30 0.13 145); }
.cal .d.today { background: oklch(0.97 0.02 248); }
.cal .d.today .num { color: var(--primary); }

/* GRIDS DENSOS */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.g-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
.g-3-1 { display: grid; grid-template-columns: 3fr 1fr; gap: 12px; }
.g-1-3 { display: grid; grid-template-columns: 1fr 3fr; gap: 12px; }

/* Side panel (filtros / aprovação) */
.side-panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.side-panel h4 { font-size: 11px; text-transform: uppercase; color: var(--muted-fg); font-weight: 600; letter-spacing: 0.05em; margin-bottom: 8px; }

/* PILL filtros / chips */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; font-size: 11px; border-radius: 999px; background: var(--secondary); color: var(--fg); border: 1px solid var(--border); }
.chip svg { width: 11px; height: 11px; opacity: 0.6; cursor: pointer; }

.hidden { display: none !important; }
.spacer { flex: 1; }
.text-up { font-size: 11px; color: var(--green-700); }
.text-dn { font-size: 11px; color: var(--red-700); }

/* RATING */
.rating { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; }
.rating svg { width: 12px; height: 12px; color: oklch(0.78 0.15 75); }

/* AVATAR PEQUENO */
.av { width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; }
</style>
</head>
<body>

<!-- CHROME -->
<div class="chrome">
  <div class="left">
    <div class="brand">TABGHA OS <small>Health Growth Operating System · v3 navegável</small></div>
    <div class="modes" id="modes">
      <button class="active" data-mode="admin">Super Admin</button>
      <button data-mode="growth">Growth</button>
      <button data-mode="social">Social Media</button>
      <button data-mode="performance">Performance</button>
      <button data-mode="atendimento">Atendimento</button>

let mode = 'admin';
let page = 'dashboard';
// Estado de expansão dos grupos. Padrão: todos expandidos.
// Persistido em localStorage por modo.
const STORAGE_KEY = 'tabgha.mockup.expandedGroups';
let expanded = loadExpanded();

function loadExpanded(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return { admin: {}, cliente: {} }; // vazio = todos expandidos por default
}
function saveExpanded(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(expanded)); } catch(e){}
}
function isExpanded(groupKey){
  // default = true; armazenamos apenas o valor quando o user explicitamente recolhe
  const v = expanded[mode]?.[groupKey];
  return v === undefined ? true : v;
}
function toggleGroup(groupKey){
  if (!expanded[mode]) expanded[mode] = {};
  expanded[mode][groupKey] = !isExpanded(groupKey);
  saveExpanded();
  renderNav();
}

function setMode(m){
  mode = m;
  // Página inicial por perfil
  const homeByMode = {
    admin:       'dashboard',
    growth:      'dashboard',
    social:      'pilares-conteudo',
    performance: 'meta-ads',
    atendimento: 'atendimento',
    financeiro:  'financeiro',
    cliente:     'c-dashboard',
  };
  page = homeByMode[m] || 'dashboard';
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  renderNav();
  render();
}

function slug(s){
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-');
}

function renderNav(){
  const groups = NAV[mode];
  const html = groups.map(g => {
    const key = slug(g.group);
    const open = isExpanded(key);
    const hasActive = g.items.some(i => i.to === page);
    const pendBadges = g.items.reduce((acc, i) => acc + (i.badge ? parseInt(i.badge,10) || 0 : 0), 0);
    return `
      <button class="group-header ${open ? 'expanded' : ''} ${hasActive ? 'has-active' : ''}" data-group="${key}">
        <span>${g.group}${pendBadges > 0 ? `<span class="ct">${pendBadges}</span>` : ''}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="group-items ${open ? '' : 'collapsed'}" data-group-items="${key}">
        ${g.items.map(i => `
          <a data-page="${i.to}" class="${i.to === page ? 'active' : ''}" style="${i.sub ? 'padding-left:28px;font-size:11.5px;opacity:0.85;' : ''}">
            ${i.ic}<span>${i.label}</span>${i.badge ? `<span class="badge-mini">${i.badge}</span>` : ''}
          </a>
        `).join('')}
      </div>
    `;
  }).join('');
  document.getElementById('nav').innerHTML = html;
  document.querySelectorAll('#nav a[data-page]').forEach(a => {
    a.onclick = () => { page = a.dataset.page; renderNav(); render(); };
  });
  document.querySelectorAll('#nav .group-header').forEach(h => {
    h.onclick = () => toggleGroup(h.dataset.group);
  });
}
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

  return html;

function renderCalendar(){
  const days = ['SEG','TER','QUA','QUI','SEX','SAB','DOM'];
  let html = '<div class="cal">';
  days.forEach(d => html += `<div class="h">${d}</div>`);
  const events = {3:'Reunião · Sim Medical',9:'Gravação Dr. Pedro',15:'Post IG · Vitalis',18:'Live IG · Pedro',20:'Carrossel · Sim Medical',23:'Reels · Welife',25:'Reunião · Cadu'};
  const altDays = [15,20,23,25];
  for(let i=1;i<=28;i++){
    const ev = events[i];
    const today = i === 18;
    const alt = altDays.includes(i);
    html += `<div class="d ${today?'today':''}"><div class="num">${i}</div>${ev?`<div class="ev ${alt?'alt':''}">${ev}</div>`:''}</div>`;
  }
  html += '</div>';
  return html;
}

function convItem(nome, fone, prev, t, sel, status){
  const ini = nome.split(' ').map(s => s[0]).slice(0,2).join('');
  const dot = {alert:'oklch(0.50 0.20 27)', bot:'oklch(0.42 0.13 248)', human:'oklch(0.45 0.13 145)', closed:'oklch(0.50 0.02 255)'}[status];
  return `<div class="conv-item ${sel?'sel':''}">
    <div class="avatar">${ini}</div>
    <div class="meta">
      <div class="name"><span>${nome}</span><span class="t">${t}</span></div>
      <div class="preview">${prev}</div>
    </div>
    <span class="dot" style="background:${dot};align-self:center"></span>
  </div>`;
}
